<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pesanan Harian</title>
    <!-- Tambahkan link manifest -->
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --shopee-orange: #ee4d2d;
            --shopee-orange-hover: #d73a1c;
            --bg-sidebar: #ffffff;
            --bg-main: #f6f6f6;
            --text-main: #333333;
        }

        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .sidebar { width: 250px; background-color: var(--bg-sidebar); min-height: 100vh; border-right: 1px solid #e5e5e5; position: fixed; top: 0; left: 0; overflow-y: auto; }
        .sidebar-item { padding: 12px 24px; color: #555; display: flex; align-items: center; cursor: pointer; transition: all 0.2s; }
        .sidebar-item:hover, .sidebar-item.active { background-color: #fef0ef; color: var(--shopee-orange); font-weight: 500; }
        .sidebar-item i { width: 24px; font-size: 1.1em; }
        .top-header { margin-left: 250px; background-color: white; height: 60px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: fixed; top: 0; right: 0; left: 0; z-index: 10; }
        .main-content { margin-left: 250px; margin-top: 60px; padding: 24px; }
        .content-card { background-color: white; border-radius: 4px; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); border: 1px solid #e5e5e5; margin-bottom: 24px; }
        .tabs { display: flex; border-bottom: 1px solid #e5e5e5; background: white; }
        .tab { padding: 16px 24px; cursor: pointer; color: #555; font-weight: 500; border-bottom: 2px solid transparent; }
        .tab:hover, .tab.active { color: var(--shopee-orange); border-bottom: 2px solid var(--shopee-orange); }
        .btn-shopee { background-color: var(--shopee-orange); color: white; padding: 8px 16px; border-radius: 2px; font-weight: 500; border: none; cursor: pointer; transition: 0.2s;}
        .btn-shopee:hover { background-color: var(--shopee-orange-hover); }
        .btn-outline { background-color: white; color: #555; border: 1px solid #ccc; padding: 8px 16px; border-radius: 2px; font-weight: 500; cursor: pointer; }
        .btn-outline:hover { background-color: #f9f9f9; }
        .input-field { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 2px; outline: none; }
        .input-field:focus { border-color: var(--shopee-orange); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background-color: #f6f6f6; color: #999; font-weight: normal; padding: 12px 16px; border-bottom: 1px solid #e5e5e5; }
        td { padding: 16px; border-bottom: 1px solid #e5e5e5; vertical-align: top; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 4px; width: 600px; max-width: 90%; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-header { padding: 16px 24px; border-bottom: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 24px; overflow-y: auto; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid #e5e5e5; text-align: right; background: #fafafa; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #333; font-size: 14px; }
        
        /* Floating Sync Status */
        #syncStatus {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 100;
        }

        /* Responsive Sidebar */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .top-header { margin-left: 0; }
            .main-content { margin-left: 0; padding: 12px; }
            .tabs { flex-wrap: wrap; }
            .tab { padding: 12px 16px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="p-6">
            <h2 class="text-xl font-bold text-[var(--shopee-orange)] flex items-center">
                <i class="fas fa-shopping-bag mr-2"></i> Seller Center
            </h2>
            <p class="text-xs text-gray-500 mt-1">Konveksi Amat Abidin</p>
        </div>
        <div class="text-xs font-bold text-gray-400 uppercase px-6 py-2 mt-2">Pesanan</div>
        <div class="sidebar-item active"><i class="far fa-list-alt"></i> Pesanan Saya</div>
    </div>

    <!-- Top Header -->
    <div class="top-header">
        <div class="text-lg font-medium flex items-center gap-4">
            Pesanan Saya
            <button id="btnConfig" class="text-xs bg-gray-100 text-green-600 px-3 py-1 rounded border border-gray-300 pointer-events-none">
                <i class="fas fa-check"></i> Terhubung Spreadsheet
            </button>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-sm">Halo, Admin</span>
            <div class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center text-white"><i class="fas fa-user"></i></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="content-card">
            <div class="tabs">
                <div class="tab active" onclick="filterStatus('Semua', this)">Semua</div>
                <div class="tab" onclick="filterStatus('Belum Dibayar', this)">Belum Dibayar</div>
                <div class="tab" onclick="filterStatus('Perlu Dikirim', this)">Perlu Dikirim</div>
                <div class="tab" onclick="filterStatus('Dikirim', this)">Dikirim</div>
                <div class="tab" onclick="filterStatus('Selesai', this)">Selesai</div>
            </div>
            
            <div class="p-4 flex justify-between items-center bg-gray-50 border-b border-gray-200">
                <div class="w-1/2 relative">
                    <input type="text" id="searchInput" placeholder="Cari No. Pesanan, Produk, atau Resi" class="input-field pl-3 pr-10">
                    <i class="fas fa-search absolute right-3 top-3 text-gray-400"></i>
                </div>
                <div class="flex gap-2">
                    <button class="btn-outline" onclick="document.getElementById('fileUpload').click()"><i class="fas fa-file-excel text-green-600"></i> Import Excel</button>
                    <input type="file" id="fileUpload" accept=".xlsx, .xls" class="hidden" onchange="handleFile(event)">
                    <button class="btn-shopee" onclick="openModal()"><i class="fas fa-plus"></i> Input Manual</button>
                </div>
            </div>

            <div class="overflow-x-auto p-4">
                <table id="orderTable">
                    <thead>
                        <tr>
                            <th width="35%">Produk</th>
                            <th width="15%">Qty</th>
                            <th width="20%">Status</th>
                            <th width="30%">Jasa Kirim / Resi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr id="emptyStateRow"><td colspan="4" class="text-center py-12 text-gray-500">Belum ada pesanan.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Input Manual -->
    <div id="inputModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="text-lg font-bold">Input Pesanan Manual</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="modal-body">
                <form id="manualOrderForm">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="form-group col-span-2">
                            <label>No. Pesanan / Resi (Bisa di-scan barcode)</label>
                            <input type="text" id="m_no_pesanan" class="input-field" placeholder="Arahkan scanner/ketik disini">
                        </div>
                        <div class="form-group col-span-2">
                            <label>Nama Produk <span class="text-red-500">*</span></label>
                            <input type="text" id="m_nama_produk" class="input-field" required>
                        </div>
                        <div class="form-group">
                            <label>Variasi</label>
                            <input type="text" id="m_variasi" class="input-field">
                        </div>
                        <div class="form-group">
                            <label>Qty <span class="text-red-500">*</span></label>
                            <input type="number" id="m_qty" class="input-field" required value="1">
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select id="m_status" class="input-field">
                                <option value="Perlu Dikirim">Perlu Dikirim</option>
                                <option value="Dikirim">Dikirim</option>
                                <option value="Selesai">Selesai</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Ekspedisi</label>
                            <select id="m_ekspedisi" class="input-field">
                                <option value="Shopee Express">Shopee Express</option>
                                <option value="J&T Express">J&T Express</option>
                                <option value="Ambil Sendiri">Ambil Sendiri</option>
                            </select>
                        </div>
                        <div class="form-group col-span-2">
                            <label>Nama Pembeli</label>
                            <input type="text" id="m_penerima" class="input-field">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-outline mr-2" onclick="closeModal()">Batal</button>
                <button type="button" class="btn-shopee" onclick="saveManualOrder()">Simpan & Sync</button>
            </div>
        </div>
    </div>

    <!-- Sync Indicator -->
    <div id="syncStatus">
        <i class="fas fa-sync fa-spin"></i> Menyinkronkan ke Spreadsheet...
    </div>

    <script>
        // --- SERVICE WORKER REGISTRATION ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker terdaftar!', reg))
                .catch(err => console.log('Service Worker gagal:', err));
            });
        }
        
        let allOrders = [];
        let currentFilter = 'Semua';
        
        // --- HARDCODED GOOGLE SCRIPT URL ---
        const googleAppScriptUrl = 'https://script.google.com/macros/s/AKfycbzXvmrirzm5qmo9m-eotVTvXccLCbHJD8dTZHI6J0gMlxOhAaB9TKDxAKX47ZvZHB41/exec';

        function syncToGoogleSheets(dataArray) {
            const syncUI = document.getElementById('syncStatus');
            syncUI.style.display = 'flex';
            syncUI.innerHTML = '<i class="fas fa-sync fa-spin"></i> Menyinkronkan ke Spreadsheet...';

            fetch(googleAppScriptUrl, {
                method: 'POST',
                body: JSON.stringify(dataArray),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(res => {
                syncUI.innerHTML = '<i class="fas fa-check text-green-400"></i> Berhasil disimpan di Spreadsheet!';
                setTimeout(() => syncUI.style.display = 'none', 3000);
            })
            .catch(err => {
                syncUI.innerHTML = '<i class="fas fa-times text-red-400"></i> Gagal terhubung. Cek koneksi / URL.';
                setTimeout(() => syncUI.style.display = 'none', 4000);
            });
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "-" });
                
                const processed = rawData.map(row => ({
                    id: row['No. Pesanan'] || 'N/A',
                    productName: row['Nama Produk'] || '',
                    variation: row['Nama Variasi'] !== '-' ? row['Nama Variasi'] : '',
                    qty: row['Jumlah'] || 1,
                    status: row['Status Pesanan'] || 'Unknown',
                    courier: row['Opsi Pengiriman'] || '',
                    resi: row['No. Resi'] !== '-' ? row['No. Resi'] : '',
                    buyerName: row['Nama Penerima'] || row['Username (Pembeli)'] || '-',
                    source: 'Import Excel'
                }));

                // Render ke tabel HTML
                allOrders = [...processed, ...allOrders];
                renderTable();
                
                // Sinkronkan batch data ke Google Sheets
                syncToGoogleSheets(processed);
            };
            reader.readAsArrayBuffer(file);
        }

        function openModal() {
            const rnd = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('m_no_pesanan').value = `MANUAL-260911-${rnd}`;
            document.getElementById('inputModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('inputModal').style.display = 'none'; document.getElementById('manualOrderForm').reset(); }

        function saveManualOrder() {
            const orderData = {
                id: document.getElementById('m_no_pesanan').value,
                productName: document.getElementById('m_nama_produk').value,
                variation: document.getElementById('m_variasi').value,
                qty: document.getElementById('m_qty').value,
                status: document.getElementById('m_status').value,
                courier: document.getElementById('m_ekspedisi').value,
                resi: document.getElementById('m_no_pesanan').value, 
                buyerName: document.getElementById('m_penerima').value,
                source: 'Input Manual'
            };

            if(!orderData.productName) { alert("Nama Produk wajib diisi!"); return; }

            allOrders.unshift(orderData);
            closeModal();
            renderTable();

            // Sinkronkan data tunggal ini ke Google Sheets
            syncToGoogleSheets([orderData]);
        }

        function getStatusColor(status) {
            status = status.toLowerCase();
            if (status.includes('batal')) return 'text-red-500 bg-red-50 border-red-200';
            if (status.includes('selesai')) return 'text-green-600 bg-green-50 border-green-200';
            if (status.includes('dikirim')) return 'text-blue-600 bg-blue-50 border-blue-200';
            if (status.includes('perlu dikirim')) return 'text-[var(--shopee-orange)] bg-orange-50 border-orange-200';
            return 'text-gray-600 bg-gray-50 border-gray-200';
        }

        function filterStatus(status, element) {
            currentFilter = status;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            renderTable();
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let filteredOrders = allOrders.filter(order => {
                if (currentFilter !== 'Semua' && !order.status.toLowerCase().includes(currentFilter.toLowerCase())) return false;
                if (searchTerm && !`${order.id} ${order.productName} ${order.resi} ${order.buyerName}`.toLowerCase().includes(searchTerm)) return false;
                return true;
            });

            if (filteredOrders.length === 0) {
                 tbody.innerHTML = `<tr id="emptyStateRow"><td colspan="4" class="text-center py-12 text-gray-500">Tidak ada pesanan.</td></tr>`;
                 return;
            }

            filteredOrders.forEach(order => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="font-bold text-sm">${order.buyerName}</div>
                        <div class="text-sm mt-2">${order.productName}</div>
                        <div class="text-xs text-gray-500">Variasi: ${order.variation}</div>
                    </td>
                    <td><div class="text-lg font-medium">${order.qty}</div></td>
                    <td><span class="px-2 py-1 border rounded text-xs font-medium ${getStatusColor(order.status)}">${order.status}</span></td>
                    <td>
                        <div class="text-sm">${order.courier}</div>
                        <div class="text-xs mt-1 bg-gray-100 px-2 py-1 rounded inline-block">${order.resi}</div>
                        <div class="text-[10px] text-gray-400 mt-1">Via: ${order.source}</div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        function renderTable() {
            // Trigger search function with empty string to render all
            document.getElementById('searchInput').dispatchEvent(new Event('input'));
        }
    </script>
</body>
</html>
