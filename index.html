<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pesanan Harian</title>
    <!-- Library PapaParse sebagai cadangan (fallback) jika Apps Script mereturn format CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f3f4f6; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        h1 { text-align: center; color: #1f2937; }
        
        /* Filter Tanggal di Dashboard */
        .date-filter {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            font-weight: bold;
            color: #4b5563;
        }
        .date-filter input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 16px;
            font-family: inherit;
        }

        /* Tampilan Dashboard */
        #dashboard-view { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px 0 40px 0; 
        }
        .card { 
            background: #3b82f6; 
            color: white; 
            padding: 30px 60px; 
            border-radius: 16px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.2s ease-in-out; 
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4); 
            width: 80%;
            max-width: 400px;
        }
        .card:hover { transform: translateY(-5px); background: #2563eb; }
        .card h2 { margin: 0; font-size: 20px; font-weight: 500; }
        .card .number { font-size: 72px; font-weight: bold; margin-top: 10px; }
        
        /* Tampilan Rincian */
        #details-view { display: none; }
        .details-header { display: flex; align-items: center; margin-bottom: 20px; }
        .btn-back { 
            background: #6b7280; color: white; border: none; padding: 10px 20px; 
            border-radius: 8px; cursor: pointer; font-size: 15px; margin-right: 20px;
        }
        .btn-back:hover { background: #4b5563; }
        .details-header h1 { margin: 0; font-size: 22px; }

        /* Fitur Pencarian Rincian */
        .search-container { margin-bottom: 15px; }
        #searchInput {
            width: 100%; padding: 12px 15px; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: 15px; box-sizing: border-box;
        }
        #searchInput:focus { outline: none; border-color: #3b82f6; }
        
        /* Desain Tabel */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { border: 1px solid #e5e7eb; padding: 14px; text-align: left; }
        th { background-color: #f9fafb; font-weight: 600; color: #374151; }
        tr:nth-child(even) { background-color: #f9fafb; }
        tr:hover { background-color: #f3f4f6; }
        
        #loading-msg { text-align: center; color: #6b7280; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Bagian Filter Tanggal (Berlaku untuk Dashboard dan Tabel) -->
    <div class="date-filter">
        <label for="filterTanggal">Pesanan Tanggal:</label>
        <input type="date" id="filterTanggal" onchange="filterAndDisplay()">
    </div>

    <div id="loading-msg">Sedang mengambil data dari server, mohon tunggu...</div>

    <!-- View 1: Dashboard Utama -->
    <div id="dashboard-view" style="display: none;">
        <div class="card" onclick="toggleView('details-view')">
            <h2>Total Produk Dipesan</h2>
            <div class="number" id="total-angka">0</div>
            <p style="margin-top:10px; font-size:14px; opacity:0.9;">Klik untuk melihat rincian variasi</p>
        </div>
    </div>

    <!-- View 2: Tabel Rincian -->
    <div id="details-view">
        <div class="details-header">
            <button class="btn-back" onclick="toggleView('dashboard-view')">← Kembali</button>
            <h1>Rincian Pesanan</h1>
        </div>
        
        <!-- Kolom Pencarian -->
        <div class="search-container">
            <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="Cari berdasarkan Nama Produk atau Ukuran...">
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>ID Pesanan</th>
                        <th>Nama Produk</th>
                        <th>Ukuran</th>
                        <th>Quantity</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Baris tabel masuk via Javascript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // URL API Google Apps Script Baru Anda
    const apiUrl = 'https://script.google.com/macros/s/AKfycbx4_xHRW7goOgIqqOUsrGyhr63rgXvY5biiWzOOZ_vbYnHmtn5BNBAIfDfj7GmXUnsu/exec';
    
    // Variabel untuk menyimpan semua data mentah dari Spreadsheet
    let allData = [];

    // Fungsi otomatis mendapatkan format tanggal hari ini (YYYY-MM-DD)
    function getTodayDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    // Set kalender default ke hari ini
    document.getElementById('filterTanggal').value = getTodayDate();

    // Fungsi mengambil data dari Apps Script
    async function fetchData() {
        try {
            const response = await fetch(apiUrl);
            const text = await response.text();
            
            // Mencoba mendeteksi jika response JSON atau CSV
            try {
                let json = JSON.parse(text);
                // Menyesuaikan dengan format output JSON standar (array atau dalam object data)
                allData = Array.isArray(json) ? json : (json.data || []);
            } catch (e) {
                // Jika error parse JSON, asumsikan output berupa CSV
                allData = Papa.parse(text, { header: true, skipEmptyLines: true }).data;
            }

            // Sembunyikan pesan loading
            document.getElementById('loading-msg').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'flex';
            
            // Tampilkan data yang sudah difilter
            filterAndDisplay();

        } catch (error) {
            console.error("Gagal memuat:", error);
            document.getElementById('loading-msg').innerText = "Gagal mengambil data. Pastikan API Apps Script berjalan normal.";
            document.getElementById('loading-msg').style.color = "red";
        }
    }

    // Fungsi menyaring (filter) data sesuai tanggal kalender yang dipilih
    function filterAndDisplay() {
        const selectedDate = document.getElementById('filterTanggal').value; // format YYYY-MM-DD
        let totalQuantity = 0;
        let tableHTML = '';

        // Saring data
        const filteredData = allData.filter(row => {
            if(!row['Tanggal']) return false;

            // Mengakali format tanggal dari Sheets agar bersih menjadi YYYY-MM-DD
            let rawDate = row['Tanggal'].toString().trim();
            let rowDate = "";
            
            if (rawDate.includes('T') && rawDate.endsWith('Z')) {
                // Format ISO dari Google Apps Script UTC
                let d = new Date(rawDate);
                let yyyy = d.getFullYear();
                let mm = String(d.getMonth() + 1).padStart(2, '0');
                let dd = String(d.getDate()).padStart(2, '0');
                rowDate = `${yyyy}-${mm}-${dd}`;
            } else {
                // Jika formatnya sudah teks string YYYY-MM-DD (membuang jam)
                rowDate = rawDate.split('T')[0].split(' ')[0];
            }
            
            return rowDate === selectedDate;
        });

        // Generate baris tabel dan hitung total
        filteredData.forEach(row => {
            const qty = parseInt(row['Quantity']) || 0;
            totalQuantity += qty; 
            
            tableHTML += `
                <tr>
                    <td>${row['Tanggal'] ? row['Tanggal'].toString().split('T')[0] : '-'}</td>
                    <td>${row['ID'] || '-'}</td>
                    <td>${row['Nama Produk'] || '-'}</td>
                    <td>${row['Ukuran'] || '-'}</td>
                    <td>${qty}</td>
                </tr>
            `;
        });

        // Update ke HTML
        document.getElementById('total-angka').innerText = totalQuantity;
        document.getElementById('table-body').innerHTML = tableHTML || `<tr><td colspan="5" style="text-align:center;">Tidak ada pesanan pada tanggal ${selectedDate}</td></tr>`;
        
        // Reset kolom pencarian saat ganti tanggal
        document.getElementById('searchInput').value = '';
        searchTable();
    }

    // Fungsi Filter/Pencarian dalam Tabel (Search Bar)
    function searchTable() {
        let input = document.getElementById("searchInput").value.toLowerCase();
        let tr = document.getElementById("table-body").getElementsByTagName("tr");

        for (let i = 0; i < tr.length; i++) {
            // Index 2 = Nama Produk, Index 3 = Ukuran
            let tdNama = tr[i].getElementsByTagName("td")[2];
            let tdUkuran = tr[i].getElementsByTagName("td")[3];
            
            if (tdNama && tdUkuran) {
                let txtValueNama = tdNama.textContent || tdNama.innerText;
                let txtValueUkuran = tdUkuran.textContent || tdUkuran.innerText;
                
                if (txtValueNama.toLowerCase().indexOf(input) > -1 || txtValueUkuran.toLowerCase().indexOf(input) > -1) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }       
        }
    }

    // Fungsi navigasi halaman Dashboard <-> Detail
    function toggleView(viewId) {
        document.getElementById('dashboard-view').style.display = viewId === 'dashboard-view' ? 'flex' : 'none';
        document.getElementById('details-view').style.display = viewId === 'details-view' ? 'block' : 'none';
        
        if(viewId === 'dashboard-view') {
            document.getElementById('searchInput').value = '';
            searchTable(); 
        }
    }

    // Jalankan saat web dimuat
    window.onload = fetchData;
</script>
</body>
</html>
